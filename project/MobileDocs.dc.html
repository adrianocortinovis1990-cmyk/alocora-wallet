<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alocora Wallet — Mobile documents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C9D2F3}
a{color:#3B5BDB}a:hover{color:#2B46B8}
.scroll::-webkit-scrollbar{display:none}
.chip:active{transform:translateY(1px)}
input::placeholder{color:#6B7085}
select option{background:#FFFFFF;color:#1B1C22}
.space{position:relative;isolation:isolate;background-color:#B7C3EE;background-image:radial-gradient(ellipse 150% 55% at -15% 108%,rgba(255,255,255,.9) 0%,rgba(242,244,252,.65) 34%,transparent 62%),radial-gradient(ellipse 75% 42% at 100% 0%,rgba(66,92,222,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 28%,rgba(150,124,240,.35),transparent 70%),linear-gradient(165deg,#D6DCF6 0%,#ABBAEE 40%,#90A4E9 62%,#C3CCF2 86%,#EBEDF9 100%)}
.grad{background:linear-gradient(90deg,#3B5BDB 0%,#7C3AED 52%,#C2418C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</helmet>
<div class="space" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1B1C22; font-size: 14px">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 56px 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Mobile.dc.html" class="chip" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 6px 14px rgba(52,64,140,0.16); color: #1B1C22; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <h1 class="grad" style="margin: 0; font-size: 20px; font-weight: 700">Documents</h1>
      <button type="button" onClick="{{pickFiles}}" class="chip" aria-label="Add document" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(27,28,34,0.28); cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <input type="file" multiple="" ref="{{setFileInput}}" onChange="{{onFiles}}" aria-label="Choose documents to add" style="display: none">
    </div>

    <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; box-sizing: border-box; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 2px rgba(40,50,110,0.1), 0 6px 16px rgba(52,64,140,0.1)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#565B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search documents</span>
      <input type="search" value="{{query}}" onChange="{{setQuery}}" placeholder="Search documents…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #1B1C22; font: 500 15px Inter, sans-serif">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 700; font-size: 16px">Folders</span>
        <div style="display: flex; gap: 6px">
          <sc-if value="{{canEdit}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{startRename}}" class="chip" aria-label="Rename folder" style="height: 32px; padding: 0 10px; border-radius: 10px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.95); background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.12); color: #1B1C22; font: 600 12px Inter, sans-serif; cursor: pointer">Rename</button>
            <button type="button" onClick="{{askDelete}}" class="chip" aria-label="Delete folder" style="height: 32px; padding: 0 10px; border-radius: 10px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.95); background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.12); color: #B4123F; font: 600 12px Inter, sans-serif; cursor: pointer">Delete</button>
          </sc-if>
          <button type="button" onClick="{{openNew}}" class="chip" style="height: 32px; padding: 0 10px; border-radius: 10px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.95); background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.12); color: #3B5BDB; font: 600 12px Inter, sans-serif; cursor: pointer">+ Folder</button>
        </div>
      </div>
      <div style="position: relative; margin: 0 -20px">
      <div class="scroll" ref="{{setRow}}" onMouseDown="{{dragStart}}" onMouseMove="{{dragMove}}" onMouseUp="{{dragEnd}}" onMouseLeave="{{dragEnd}}" onScroll="{{onRowScroll}}" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 56px 10px 20px; scroll-snap-type: x proximity; scroll-padding: 0 20px; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; cursor: {{cursor}}; user-select: none">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="6">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 12px; box-sizing: border-box; border: 1px solid {{f.edge}}; background: {{f.bg}}; box-shadow: {{f.shadow}}; color: {{f.fg}}; font: 600 13px Inter, sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="{{f.fill}}" stroke="{{f.color}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>{{f.name}}<span style="font-size: 11px; opacity: 0.7">{{f.count}}</span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{showLeft}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{scrollLeft}}" aria-label="Show previous folders" style="position: absolute; left: 0; top: 0; bottom: 6px; width: 48px; border: 0; padding: 0 0 0 8px; background: linear-gradient(90deg, rgba(190,200,240,0.95) 30%, transparent); display: flex; align-items: center; cursor: pointer"><span style="width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.16); color: #1B1C22; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></span></button>
      </sc-if>
      <sc-if value="{{showRight}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{scrollRight}}" aria-label="Show more folders" style="position: absolute; right: 0; top: 0; bottom: 6px; width: 56px; border: 0; padding: 0 10px 0 0; background: linear-gradient(270deg, rgba(190,200,240,0.95) 35%, transparent); display: flex; align-items: center; justify-content: flex-end; cursor: pointer"><span style="width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.16); color: #1B1C22; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></button>
      </sc-if>
      </div>

      <sc-if value="{{nameMode}}" hint-placeholder-val="{{false}}">
        <form onSubmit="{{submitName}}" style="display: flex; gap: 8px">
          <input aria-label="Folder name" value="{{nameDraft}}" onChange="{{setNameDraft}}" placeholder="Folder name" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(214,220,242,0.6); box-shadow: inset 0 1px 3px rgba(40,50,110,0.2); color: #1B1C22; font: 500 15px Inter, sans-serif; outline: 0">
          <button type="submit" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #1B1C22; color: #FFFFFF; font: 600 13px Inter, sans-serif; cursor: pointer">{{nameBtn}}</button>
          <button type="button" onClick="{{cancelName}}" aria-label="Cancel" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,0.6); color: #1B1C22; cursor: pointer">✕</button>
        </form>
      </sc-if>
      <sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.7); border: 1px solid rgba(180,18,63,0.3); display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 13px; line-height: 1.4">Delete “{{curName}}”? {{deleteNote}}</span>
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{cancelDelete}}" style="flex: 1; height: 40px; border: 1px solid rgba(40,50,110,0.15); border-radius: 10px; background: #FFFFFF; color: #1B1C22; font: 600 13px Inter, sans-serif; cursor: pointer">Cancel</button>
            <button type="button" onClick="{{confirmDelete}}" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: #B4123F; color: #FFFFFF; font: 600 13px Inter, sans-serif; cursor: pointer">Delete</button>
          </div>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{hasNotice}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.6); font-size: 13px; color: #2B46B8">{{notice}}</p>
    </sc-if>

    <span style="font-size: 13px; color: #2E3244; font-weight: 500">{{countLabel}}</span>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <button type="button" onClick="{{pickFiles}}" style="height: 180px; border-radius: 18px; border: 1px dashed rgba(59,91,219,0.45); background: rgba(255,255,255,0.4); color: #3B5BDB; font: 600 14px Inter, sans-serif; cursor: pointer">No documents here yet — tap to add</button>
    </sc-if>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{docs}}" as="d" hint-placeholder-count="6">
        <button type="button" onClick="{{d.open}}" aria-label="Preview {{d.name}}" style="padding: 0; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.38); background: rgba(255,255,255,0.32); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.36), 0 10px 24px rgba(52,64,140,0.14); color: #1B1C22; text-align: left; display: flex; flex-direction: column; cursor: pointer">
          <div style="height: 120px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(214,220,242,0.45)">
            <sc-if value="{{d.isImg}}" hint-placeholder-val="{{false}}"><img src="{{d.url}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
            <sc-if value="{{d.isArt}}" hint-placeholder-val="{{false}}"><div style="width: 100%; height: 100%; background: radial-gradient(circle at 60% 40%, {{d.artA}} 0%, {{d.artB}} 38%, transparent 62%), #101119; display: flex; align-items: center; justify-content: center"><div style="width: 44px; height: 44px; border-radius: 13px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; font: 700 18px Inter, sans-serif"><svg width="1.3em" height="1.3em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M4.5 20 12 4l7.5 16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8.3 14.3h7.4" stroke="#A78BFA" stroke-width="2.8" stroke-linecap="round"></path><circle cx="12" cy="4.2" r="1.2" fill="#F472B6"></circle></svg></div></div></sc-if>
            <sc-if value="{{d.isPage}}" hint-placeholder-val="{{true}}">
              <div style="width: {{d.pageW}}px; height: 96px; box-sizing: border-box; padding: 8px 7px; border-radius: 4px; background: #FFFFFF; box-shadow: 0 10px 22px rgba(30,40,90,0.25); transform: translateY(8px) rotate(-2deg); display: flex; flex-direction: column; gap: 4px">
                <span style="width: 55%; height: 5px; border-radius: 2px; background: {{d.color}}"></span>
                <sc-for list="{{d.lines}}" as="w" hint-placeholder-count="6"><span style="height: 3px; width: {{w}}%; border-radius: 2px; background: #D4D4D8"></span></sc-for>
              </div>
            </sc-if>
            <span style="position: absolute; top: 8px; left: 8px; height: 20px; padding: 0 7px; border-radius: 6px; background: {{d.color}}; color: #FFFFFF; font: 700 10px/20px Inter, sans-serif">{{d.ext}}</span>
          </div>
          <span style="padding: 10px 10px 2px; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span>
          <span style="padding: 0 10px 10px; font-size: 11px; color: #565B70">{{d.meta}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 20; background: rgba(60,70,130,0.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; flex-direction: column">
      <button type="button" aria-label="Close preview" onClick="{{closeSel}}" style="flex: 1; min-height: 40px; border: 0; background: transparent; cursor: pointer"></button>
      <div role="dialog" aria-label="Document preview" style="padding: 12px 20px 30px; border-radius: 28px 28px 0 0; background: rgba(246,247,253,0.5); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); box-shadow: 0 -20px 50px rgba(40,50,120,0.25), inset 0 1px 0 #FFFFFF; display: flex; flex-direction: column; gap: 14px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: rgba(40,50,110,0.2)"></span>
        <div style="height: 260px; border-radius: 18px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(214,220,242,0.5); box-shadow: inset 0 1px 3px rgba(40,50,110,0.15)">
          <sc-if value="{{p.isImg}}" hint-placeholder-val="{{false}}"><img src="{{p.url}}" alt="{{p.name}}" style="max-width: 100%; max-height: 100%; object-fit: contain"></sc-if>
          <sc-if value="{{p.isArt}}" hint-placeholder-val="{{false}}"><div role="img" aria-label="{{p.name}}" style="width: 100%; height: 100%; background: radial-gradient(circle at 60% 40%, {{p.artA}} 0%, {{p.artB}} 38%, transparent 62%), #101119; display: flex; align-items: center; justify-content: center"><div style="width: 80px; height: 80px; border-radius: 24px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; font: 700 34px Inter, sans-serif"><svg width="1.3em" height="1.3em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M4.5 20 12 4l7.5 16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8.3 14.3h7.4" stroke="#A78BFA" stroke-width="2.8" stroke-linecap="round"></path><circle cx="12" cy="4.2" r="1.2" fill="#F472B6"></circle></svg></div></div></sc-if>
          <sc-if value="{{p.isPage}}" hint-placeholder-val="{{true}}">
            <div role="img" aria-label="Preview of {{p.name}}" style="width: {{p.bigW}}px; height: 226px; box-sizing: border-box; padding: 14px 12px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 18px 36px rgba(30,40,90,0.3); display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between"><span style="width: 22px; height: 22px; border-radius: 6px; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 9px Inter, sans-serif"><svg width="1.3em" height="1.3em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M4.5 20 12 4l7.5 16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8.3 14.3h7.4" stroke="#A78BFA" stroke-width="2.8" stroke-linecap="round"></path><circle cx="12" cy="4.2" r="1.2" fill="#F472B6"></circle></svg></span><span style="font: 700 10px Inter, sans-serif; color: {{p.color}}">{{p.heading}}</span></div>
              <sc-for list="{{p.lines}}" as="w" hint-placeholder-count="10"><span style="height: 4px; width: {{w}}%; border-radius: 2px; background: #D4D4D8"></span></sc-for>
            </div>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700; word-break: break-word">{{p.name}}</span>
          <span style="font-size: 13px; color: #565B70">{{p.typeLabel}} · {{p.size}} · {{p.date}}</span>
        </div>
        <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-weight: 600">Folder</span>
          <select value="{{p.folder}}" onChange="{{p.move}}" style="height: 42px; min-width: 170px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.95); background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.12); color: #1B1C22; font: 500 14px Inter, sans-serif">
            <sc-for list="{{folderOptions}}" as="o" hint-placeholder-count="6"><option value="{{o.id}}">{{o.name}}</option></sc-for>
          </select>
        </label>
        <div style="display: flex; gap: 8px">
          <sc-if value="{{p.hasUrl}}" hint-placeholder-val="{{false}}">
            <a href="{{p.url}}" download="{{p.name}}" style="flex: 1; height: 48px; border-radius: 14px; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 14px Inter, sans-serif; text-decoration: none">Download</a>
          </sc-if>
          <sc-if value="{{p.noUrl}}" hint-placeholder-val="{{true}}">
            <button type="button" disabled="" title="Sample document — no file attached" style="flex: 1; height: 48px; border-radius: 14px; border: 0; background: rgba(214,220,242,0.7); color: #565B70; font: 600 14px Inter, sans-serif">Download</button>
          </sc-if>
          <button type="button" onClick="{{p.remove}}" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid rgba(180,18,63,0.35); background: rgba(229,17,79,0.08); color: #B4123F; font: 600 14px Inter, sans-serif; cursor: pointer">Delete</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const D = (id, name, type, kb, date, folder) => ({ id, name, type, kb, date, folder, url: '' });
    this.state = { folder: 'all', query: '', sel: null, nameMode: null, nameDraft: '', confirm: false, notice: '', nextId: 100,
      folders: [{ id: 'f1', name: 'Invoices' }, { id: 'f2', name: 'Receipts' }, { id: 'f3', name: 'Contracts' }, { id: 'f4', name: 'Business plans' }, { id: 'f5', name: 'Tax' }, { id: 'f6', name: 'Brand assets' }],
      docs: [
        D('d1', 'Invoice INV-0142.pdf', 'pdf', 184, '2 Nov 2026', 'f1'), D('d2', 'Invoice INV-0141.pdf', 'pdf', 176, '18 Oct 2026', 'f1'),
        D('d3', 'Google Ads receipt — Oct.pdf', 'receipt', 92, '31 Oct 2026', 'f2'), D('d4', 'KLM booking.pdf', 'receipt', 120, '28 Oct 2026', 'f2'),
        D('d5', 'Supplier agreement.docx', 'doc', 312, '12 Oct 2026', 'f3'), D('d6', 'Office lease 2026.pdf', 'pdf', 1430, '3 Jan 2026', 'f3'),
        D('d7', 'Business plan 2027.docx', 'doc', 540, '1 Nov 2026', 'f4'), D('d8', '12-month forecast.xlsx', 'sheet', 88, '1 Nov 2026', 'f4'),
        D('d9', 'VAT return Q3.pdf', 'pdf', 210, '20 Oct 2026', 'f5'), D('d11', 'Logo — dark.png', 'art', 64, '15 Sep 2026', 'f6')
      ] };
  }
  componentWillUnmount() { (this.state.docs || []).forEach(d => { if (d.url) URL.revokeObjectURL(d.url); }); }
  size(kb) { return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB'; }
  kindOf(f) { const n = f.name.toLowerCase(), t = f.type || ''; if (t.startsWith('image/')) return 'img'; if (t === 'application/pdf' || n.endsWith('.pdf')) return 'pdf'; if (/\.(xlsx?|csv|numbers|ods)$/.test(n)) return 'sheet'; if (/\.(docx?|txt|rtf|pages|odt|md)$/.test(n)) return 'doc'; return 'file'; }
  addFiles(list) {
    const files = Array.from(list || []); if (!files.length) return;
    const s = this.state; let folders = s.folders; let target = s.folder !== 'all' ? s.folder : null;
    if (!target) { let u = folders.find(f => f.name === 'Unsorted'); if (!u) { u = { id: 'f' + s.nextId, name: 'Unsorted' }; folders = folders.concat([u]); } target = u.id; }
    let id = s.nextId + 1; const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const added = files.map(f => ({ id: 'u' + (id++), name: f.name, type: this.kindOf(f), kb: f.size / 1024, date: today, folder: target, url: URL.createObjectURL(f) }));
    this.setState({ folders, docs: added.concat(s.docs), nextId: id, notice: added.length + (added.length === 1 ? ' document' : ' documents') + ' added to ' + folders.find(f => f.id === target).name + '.' });
  }
  renderVals() {
    const st = this.state;
    const CHIP_BG = 'linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%)';
    const T = { pdf: ['PDF', '#E5114F', 74, 'INVOICE'], receipt: ['Receipt', '#6B7085', 52, 'RECEIPT'], doc: ['Document', '#3B5BDB', 74, 'DOCUMENT'], sheet: ['Spreadsheet', '#3E4257', 80, 'SHEET'], art: ['Image', '#7C3AED', 74, ''], img: ['Image', '#7C3AED', 74, ''], file: ['File', '#565B70', 74, 'FILE'] };
    const seed = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 997; return h; };
    const lines = (d, n) => { const h = seed(d.name); return Array.from({ length: n }, (_, i) => 45 + ((h * (i + 3)) % 50)); };
    const ext = (d) => { const m = d.name.match(/\.([a-z0-9]+)$/i); return (m ? m[1] : T[d.type][0]).toUpperCase().slice(0, 5); };
    const arts = [['#7FA6FF', '#2F3FB0'], ['#E879F9', '#6D28D9']];
    const fname = (id) => (st.folders.find(f => f.id === id) || { name: '—' }).name;
    const colors = ['#3B5BDB', '#7C3AED', '#C2418C', '#3E4257', '#B4123F', '#6227C9', '#6B7085'];
    const allF = [{ id: 'all', name: 'All' }].concat(st.folders);
    const folders = allF.map((f, i) => { const on = st.folder === f.id; const c = colors[i % colors.length]; return { name: f.name, count: f.id === 'all' ? st.docs.length : st.docs.filter(d => d.folder === f.id).length, color: on ? '#FFFFFF' : c, fill: 'none', pressed: on ? 'true' : 'false', bg: on ? '#1B1C22' : CHIP_BG, fg: on ? '#FFFFFF' : '#1B1C22', edge: on ? '#1B1C22' : 'rgba(255,255,255,0.95)', shadow: on ? '0 6px 14px rgba(27,28,34,0.25)' : '0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.12)', pick: () => this.setState({ folder: f.id, confirm: false, nameMode: null }) }; });
    const q = st.query.trim().toLowerCase();
    const vis = st.docs.filter(d => (st.folder === 'all' || d.folder === st.folder) && (!q || d.name.toLowerCase().includes(q)));
    const docs = vis.map(d => { const t = T[d.type]; const a = arts[seed(d.name) % 2]; return { name: d.name, ext: ext(d), color: t[1], url: d.url, meta: this.size(d.kb) + ' · ' + fname(d.folder), isImg: d.type === 'img', isArt: d.type === 'art', isPage: d.type !== 'img' && d.type !== 'art', pageW: t[2], lines: lines(d, 6), artA: a[0], artB: a[1], open: () => this.setState({ sel: d.id }) }; });
    const removeDoc = (d) => { if (d.url) URL.revokeObjectURL(d.url); this.setState({ docs: this.state.docs.filter(x => x.id !== d.id), sel: null, notice: '“' + d.name + '” deleted.' }); };
    const sd = st.docs.find(d => d.id === st.sel);
    let p = {};
    if (sd) { const t = T[sd.type]; const a = arts[seed(sd.name) % 2]; p = { name: sd.name, url: sd.url, hasUrl: !!sd.url, noUrl: !sd.url, color: t[1], heading: t[3], typeLabel: t[0], size: this.size(sd.kb), date: sd.date, folder: sd.folder, isImg: sd.type === 'img', isArt: sd.type === 'art', isPage: sd.type !== 'img' && sd.type !== 'art', bigW: sd.type === 'receipt' ? 120 : 170, lines: lines(sd, 10), artA: a[0], artB: a[1], move: (e) => { const to = e.target.value; this.setState({ docs: this.state.docs.map(x => x.id === sd.id ? { ...x, folder: to } : x), notice: '“' + sd.name + '” moved to ' + fname(to) + '.' }); }, remove: () => removeDoc(sd) }; }
    const cur = st.folders.find(f => f.id === st.folder);
    const n = cur ? st.docs.filter(d => d.folder === cur.id).length : 0;
    const drag = this.drag || (this.drag = { on: false, x: 0, left: 0, moved: false });
    const edges = () => { const r = this.row; if (!r) return; const l = r.scrollLeft > 4, rr = r.scrollLeft + r.clientWidth < r.scrollWidth - 4; if (l !== !!this.state.showL || rr !== (this.state.showR !== false)) this.setState({ showL: l, showR: rr }); };
    return {
      setRow: (el) => { this.row = el; if (el) setTimeout(edges, 0); },
      cursor: st.draggingF ? 'grabbing' : 'grab',
      dragStart: (e) => { if (!this.row) return; drag.on = true; drag.moved = false; drag.x = e.pageX; drag.left = this.row.scrollLeft; this.setState({ draggingF: true }); },
      dragMove: (e) => { if (!drag.on || !this.row) return; const dx = e.pageX - drag.x; if (Math.abs(dx) > 4) drag.moved = true; e.preventDefault(); this.row.scrollLeft = drag.left - dx; },
      dragEnd: (e) => { if (!drag.on) return; drag.on = false; this.setState({ draggingF: false }); if (drag.moved && e && e.type === 'mouseup') { const stop = (ev) => { ev.stopPropagation(); ev.preventDefault(); window.removeEventListener('click', stop, true); }; window.addEventListener('click', stop, true); setTimeout(() => window.removeEventListener('click', stop, true), 50); } },
      onRowScroll: edges,
      showLeft: !!st.showL, showRight: st.showR !== false,
      scrollLeft: () => { if (this.row) this.row.scrollBy({ left: -180, behavior: 'smooth' }); },
      scrollRight: () => { if (this.row) this.row.scrollBy({ left: 180, behavior: 'smooth' }); },
      folders, docs, p, hasSel: !!sd, isEmpty: docs.length === 0,
      countLabel: (cur ? cur.name : 'All documents') + ' · ' + docs.length + (docs.length === 1 ? ' document' : ' documents'),
      folderOptions: st.folders.map(f => ({ id: f.id, name: f.name })),
      canEdit: !!cur, curName: cur ? cur.name : '', confirming: st.confirm && !!cur,
      deleteNote: n ? 'Its ' + n + (n === 1 ? ' document moves' : ' documents move') + ' to Unsorted.' : 'It is empty.',
      query: st.query, setQuery: (e) => this.setState({ query: e.target.value }),
      hasNotice: !!st.notice, notice: st.notice,
      nameMode: !!st.nameMode, nameDraft: st.nameDraft, nameBtn: st.nameMode === 'rename' ? 'Save' : 'Create',
      openNew: () => this.setState({ nameMode: 'new', nameDraft: '', confirm: false }),
      startRename: () => this.setState({ nameMode: 'rename', nameDraft: cur ? cur.name : '', confirm: false }),
      cancelName: () => this.setState({ nameMode: null }),
      setNameDraft: (e) => this.setState({ nameDraft: e.target.value }),
      submitName: (e) => {
        e.preventDefault(); const s = this.state; const name = s.nameDraft.trim() || 'New folder';
        if (s.nameMode === 'rename' && cur) this.setState({ folders: s.folders.map(f => f.id === cur.id ? { ...f, name } : f), nameMode: null, notice: 'Folder renamed to “' + name + '”.' });
        else { const id = 'f' + s.nextId; this.setState({ folders: s.folders.concat([{ id, name }]), folder: id, nextId: s.nextId + 1, nameMode: null, notice: 'Folder “' + name + '” created.' }); }
      },
      askDelete: () => this.setState({ confirm: true, nameMode: null }),
      cancelDelete: () => this.setState({ confirm: false }),
      confirmDelete: () => {
        const s = this.state; if (!cur) return; let fs = s.folders.filter(f => f.id !== cur.id); let docsN = s.docs;
        if (n) { let u = fs.find(f => f.name === 'Unsorted'); if (!u) { u = { id: 'f' + s.nextId, name: 'Unsorted' }; fs = fs.concat([u]); } docsN = s.docs.map(d => d.folder === cur.id ? { ...d, folder: u.id } : d); }
        this.setState({ folders: fs, docs: docsN, folder: 'all', confirm: false, nextId: s.nextId + 1, notice: 'Folder “' + cur.name + '” deleted.' });
      },
      closeSel: () => this.setState({ sel: null }),
      setFileInput: (el) => { this.fileInput = el; },
      pickFiles: () => { if (this.fileInput) { this.fileInput.value = ''; this.fileInput.click(); } },
      onFiles: (e) => this.addFiles(e.target.files)
    };
  }
}
</script>
