body{margin:0;background:#C9D2F3}
.space{position:relative;isolation:isolate;background-color:#B7C3EE;background-image:radial-gradient(ellipse 150% 55% at -15% 108%,rgba(255,255,255,.9) 0%,rgba(242,244,252,.65) 34%,transparent 62%),radial-gradient(ellipse 75% 42% at 100% 0%,rgba(66,92,222,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 28%,rgba(150,124,240,.35),transparent 70%),linear-gradient(165deg,#D6DCF6 0%,#ABBAEE 40%,#90A4E9 62%,#C3CCF2 86%,#EBEDF9 100%)}
.grad{background:linear-gradient(90deg,#3B5BDB 0%,#7C3AED 52%,#C2418C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{background:linear-gradient(115deg,#3B82F6 0%,#5B6CF2 20%,#8B5CF6 38%,#C04BD8 54%,#EC4899 68%,#F97316 88%);-webkit-mask-image:radial-gradient(circle,#000 2.4px,transparent 3px),radial-gradient(ellipse 78% 92% at 46% -6%,#000 0%,rgba(0,0,0,.92) 38%,rgba(0,0,0,.45) 60%,transparent 76%);-webkit-mask-size:11px 11px,100% 100%;-webkit-mask-composite:source-in;mask-image:radial-gradient(circle,#000 2.4px,transparent 3px),radial-gradient(ellipse 78% 92% at 46% -6%,#000 0%,rgba(0,0,0,.92) 38%,rgba(0,0,0,.45) 60%,transparent 76%);mask-size:11px 11px,100% 100%;mask-composite:intersect}
.dots2{background:linear-gradient(115deg,#3B82F6 0%,#5B6CF2 20%,#8B5CF6 38%,#C04BD8 54%,#EC4899 68%,#F97316 88%);-webkit-mask-image:radial-gradient(circle,#000 4px,transparent 4.6px),radial-gradient(ellipse 42% 72% at 14% 8%,#000 0%,rgba(0,0,0,.7) 45%,transparent 74%);-webkit-mask-size:22px 22px,100% 100%;-webkit-mask-position:6px 6px,0 0;-webkit-mask-composite:source-in;mask-image:radial-gradient(circle,#000 4px,transparent 4.6px),radial-gradient(ellipse 42% 72% at 14% 8%,#000 0%,rgba(0,0,0,.7) 45%,transparent 74%);mask-size:22px 22px,100% 100%;mask-position:6px 6px,0 0;mask-composite:intersect}
.soc{transition:transform .15s ease, box-shadow .2s ease, background .2s}
.soc:hover{box-shadow:0 1px 2px rgba(30,40,90,0.14),0 10px 22px rgba(52,64,140,0.18)}
.soc:active,.go:active{transform:translateY(1px)}
.go:hover{filter:brightness(1.15)}
.field:focus-within{box-shadow:inset 0 1px 3px rgba(40,50,110,0.18),0 0 0 3px rgba(124,58,237,0.22)}
.lnk{color:#3B5BDB;text-decoration:none;font-weight:600}
.lnk:hover{text-decoration:underline}
input::placeholder{color:#7A7F94}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(-4deg)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(420%) skewX(-18deg)}}
.sheen{position:absolute;top:-10%;bottom:-10%;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(170,200,255,.14) 42%,rgba(255,255,255,.22) 50%,rgba(170,200,255,.14) 58%,transparent);animation:sheen 5.5s ease-in-out infinite;pointer-events:none}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.spin,.fu,.float,.sheen,.pop{animation:none}}
</style>
