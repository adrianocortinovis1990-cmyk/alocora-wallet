<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alocora Wallet — Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C9D2F3}
a{color:#3B5BDB}a:hover{color:#2B46B8}
.key:hover{background:rgba(255,255,255,0.45)}
.key:active{background:rgba(255,255,255,0.75)}
.chip:active{transform:translateY(1px)}
.space{position:relative;isolation:isolate;background-color:#B7C3EE;background-image:radial-gradient(ellipse 150% 55% at -15% 108%,rgba(255,255,255,.9) 0%,rgba(242,244,252,.65) 34%,transparent 62%),radial-gradient(ellipse 75% 42% at 100% 0%,rgba(66,92,222,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 28%,rgba(150,124,240,.35),transparent 70%),linear-gradient(165deg,#D6DCF6 0%,#ABBAEE 40%,#90A4E9 62%,#C3CCF2 86%,#EBEDF9 100%)}
.grad{background:linear-gradient(90deg,#3B5BDB 0%,#7C3AED 52%,#C2418C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</helmet>
<div class="space" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1B1C22; font-size: 14px; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Mobile.dc.html" class="chip" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 6px 14px rgba(52,64,140,0.16); color: #1B1C22; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="grad" style="margin: 0; font-size: 20px; font-weight: 700">New expense</h1>
    <button type="button" class="chip" aria-label="Scan receipt" style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 6px 14px rgba(52,64,140,0.16); color: #1B1C22; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path><circle cx="12" cy="12" r="3.5"></circle></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0">
    <span aria-live="polite" style="font-size: 52px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; color: {{amountColor}}">€{{amount}}</span>
    <span style="font-size: 13px; color: #2E3244; font-weight: 500">From {{account}}</span>
  </div>

  <div style="padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.32); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.34); box-shadow: inset 0 1px 0 rgba(255,255,255,0.36), 0 18px 40px rgba(52,64,140,0.16); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #565B70; font-weight: 600">Category</span>
      <div role="radiogroup" aria-label="Category" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="height: 36px; padding: 0 14px; border-radius: 10px; box-sizing: border-box; border: 1px solid {{c.edge}}; background: {{c.bg}}; box-shadow: {{c.shadow}}; color: {{c.fg}}; font: 600 13px Inter, sans-serif; cursor: pointer">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #565B70; font-weight: 600">Account / project</span>
      <div style="display: flex; padding: 4px; gap: 2px; border-radius: 12px; background: rgba(214,220,242,0.6); box-shadow: inset 0 1px 3px rgba(40,50,110,0.18), inset 0 -1px 0 rgba(255,255,255,0.6)">
        <sc-for list="{{accs}}" as="a" hint-placeholder-count="3">
          <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="flex: 1; min-width: 0; height: 38px; padding: 0 6px; border-radius: 9px; border: 0; background: {{a.bg}}; box-shadow: {{a.shadow}}; color: {{a.fg}}; font: 600 12px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">{{a.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" class="key" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 54px; border: 0; border-radius: 14px; background: transparent; color: #1B1C22; font: 600 24px Inter, sans-serif; cursor: pointer">{{k.label}}</button>
    </sc-for>
  </div>

  <button type="button" onClick="{{save}}" class="chip" style="height: 54px; border-radius: 16px; border: 0; background: {{saveBg}}; color: {{saveFg}}; box-shadow: {{saveShadow}}; font: 600 16px Inter, sans-serif; cursor: pointer">{{saveLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '0', cat: 'Marketing', acc: 'Spring Launch', saved: false };
  }
  renderVals() {
    const st = this.state;
    const CHIP_BG = 'linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%)';
    const CHIP_SH = '0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.14)';
    const press = (k) => () => {
      let a = st.saved ? '0' : st.amount;
      if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
      else if (k === '.') { if (!a.includes('.')) a += '.'; }
      else {
        if (a.includes('.') && a.split('.')[1].length >= 2) return;
        if (a.replace('.', '').length >= 7) return;
        a = a === '0' ? k : a + k;
      }
      this.setState({ amount: a, saved: false });
    };
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'].map(k => ({ label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k === '.' ? 'Decimal point' : k), press: press(k) }));
    const cats = ['Marketing', 'Operations', 'Payroll', 'R&D', 'Travel'].map(c => { const on = st.cat === c; return { label: c, checked: on ? 'true' : 'false', bg: on ? '#1B1C22' : CHIP_BG, fg: on ? '#FFFFFF' : '#1B1C22', edge: on ? '#1B1C22' : 'rgba(255,255,255,0.95)', shadow: on ? '0 6px 14px rgba(27,28,34,0.25)' : CHIP_SH, pick: () => this.setState({ cat: c }) }; });
    const accs = ['Main account', 'Spring Launch', 'Platform v2'].map(a => { const on = st.acc === a; return { label: a, pressed: on ? 'true' : 'false', bg: on ? CHIP_BG : 'transparent', shadow: on ? CHIP_SH : 'none', fg: on ? '#1B1C22' : '#3E4257', pick: () => this.setState({ acc: a }) }; });
    const empty = Number(st.amount) === 0;
    return {
      amount: st.amount, amountColor: empty ? '#6B7085' : '#1B1C22', account: st.acc, cats, accs, keys,
      saveLabel: st.saved ? 'Saved to ' + st.acc : 'Save expense',
      saveBg: st.saved ? '#3E4257' : (empty ? 'rgba(214,220,242,0.75)' : '#1B1C22'),
      saveFg: st.saved ? '#FFFFFF' : (empty ? '#565B70' : '#FFFFFF'),
      saveShadow: empty && !st.saved ? 'inset 0 1px 3px rgba(40,50,110,0.15)' : '0 12px 26px rgba(27,28,34,0.28)',
      save: () => { if (!empty) this.setState({ saved: true }); }
    };
  }
}
</script>
</body>
</html>
