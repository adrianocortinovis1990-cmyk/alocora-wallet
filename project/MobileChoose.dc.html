<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alocora Wallet — Mobile choose profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C9D2F3}
a{color:#1B1C22}
.pcard:active{transform:scale(.98)}
.space{position:relative;isolation:isolate;background-color:#B7C3EE;background-image:radial-gradient(ellipse 150% 55% at -15% 108%,rgba(255,255,255,.9) 0%,rgba(242,244,252,.65) 34%,transparent 62%),radial-gradient(ellipse 75% 42% at 100% 0%,rgba(66,92,222,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 28%,rgba(150,124,240,.35),transparent 70%),linear-gradient(165deg,#D6DCF6 0%,#ABBAEE 40%,#90A4E9 62%,#C3CCF2 86%,#EBEDF9 100%)}
.grad{background:linear-gradient(90deg,#3B5BDB 0%,#7C3AED 52%,#C2418C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</helmet>
<div class="space" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 64px 20px 32px; font-family: Inter, system-ui, sans-serif; color: #1B1C22; font-size: 14px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="width: 44px; height: 44px; border-radius: 13px; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; letter-spacing: -0.04em; box-shadow: 0 8px 18px rgba(27,28,34,0.25)"><svg width="1.3em" height="1.3em" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path d="M4.5 20 12 4l7.5 16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8.3 14.3h7.4" stroke="#A78BFA" stroke-width="2.8" stroke-linecap="round"></path><circle cx="12" cy="4.2" r="1.2" fill="#F472B6"></circle></svg></div>
    <span aria-label="Signed in as YN" role="img" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; box-shadow: 0 0 0 3px #FFFFFF">YN</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 class="grad" style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1">Choose your profile</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #2E3244">Each profile keeps its own accounts, cards and budgets — fully separate. Switch any time in Settings.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
      <a href="{{p.href}}" onClick="{{p.pick}}" class="pcard" style="text-decoration: none; padding: 18px; border-radius: 22px; background: rgba(255,255,255,0.33); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.36); box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), 0 16px 34px rgba(52,64,140,0.18); display: flex; align-items: center; gap: 14px; color: #1B1C22">
        <span aria-hidden="true" style="width: 52px; height: 52px; flex: none; border-radius: 16px; background: linear-gradient(180deg, #FFFFFF 0%, #EEF1FA 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 6px 14px rgba(52,64,140,0.16); color: {{p.color}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{p.isBiz}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></sc-if>
          <sc-if value="{{p.isPersonal}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></sc-if>
          <sc-if value="{{p.isFamily}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"></path><circle cx="9" cy="13" r="1.6"></circle><circle cx="15" cy="13" r="1.6"></circle><path d="M7 19a2 2 0 0 1 4 0M13 19a2 2 0 0 1 4 0"></path></svg></sc-if>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 18px; font-weight: 700">{{p.title}}</span>
          <span style="font-size: 13px; line-height: 1.4; color: #3E4257">{{p.desc}}</span>
        </span>
        <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </a>
    </sc-for>
  </div>
  <span style="margin-top: auto; text-align: center; font-size: 12px; color: #3E4257">You can add more profiles later in Settings</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const save = (k) => () => { try { window.localStorage.setItem('allot.profile', k); } catch (e) {} };
    const profiles = [
      { k: 'business', title: 'Business', href: 'Mobile.dc.html', color: '#3B5BDB', desc: 'Company expenses, budgets and projects' },
      { k: 'personal', title: 'Personal', href: 'MobilePersonal.dc.html', color: '#7C3AED', desc: 'Salary, daily spending and savings goals' },
      { k: 'family', title: 'Family', href: 'MobileFamily.dc.html', color: '#C2418C', desc: 'Joint account, household budgets, shared goals' }
    ].map(p => ({ ...p, isBiz: p.k === 'business', isPersonal: p.k === 'personal', isFamily: p.k === 'family', pick: save(p.k) }));
    return { profiles };
  }
}
</script>
</body>
</html>
