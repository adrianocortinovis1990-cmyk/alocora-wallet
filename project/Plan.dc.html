<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1480}}'>
class Component extends DCLogic {
  initReveal(sel) {
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

      });
    }, { threshold: 0.06, rootMargin: '0px 0px -4% 0px' });
    const scan = () => {
      let els = [];
      try { els = document.querySelectorAll(sel); } catch (e) { return; }
      els.forEach((el) => { if (el.dataset.rv) return; el.dataset.rv = '1'; el.classList.add('rv'); this.rvIO.observe(el); });
    };
    scan();
    try { this.rvMO = new MutationObserver(() => { clearTimeout(this.rvT); this.rvT = setTimeout(scan, 30); }); this.rvMO.observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  }
  stopReveal() { if (this.rvIO) this.rvIO.disconnect(); if (this.rvMO) this.rvMO.disconnect(); clearTimeout(this.rvT); }

  constructor(props) {

  }
  eur(n) { return (n < 0 ? '−' : '') + new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Math.abs(n)); }
  short(n) { const a = Math.abs(n); const s = a >= 1000 ? (a / 1000).toFixed(a >= 100000 ? 0 : 1) + 'k' : String(Math.round(a)); return (n < 0 ? '−€' : '€') + s; }
  renderVals() {
    const st = this.state;
    const S = [
      { label: 'Summary', help: 'What you do, for whom, and why now. Keep it to a few sentences — you can come back to it.', fields: [['Mission', '[What your company or household is working towards]'], ['The problem you solve', '[Who has the problem and how big it is]']] },
      { label: 'Market', help: 'Who buys, how many of them there are, and who else serves them.', fields: [['Target customers', '[Describe your ideal customer]'], ['Competitors', '[Main alternatives and how you differ]']] },
      { label: 'Revenue model', help: 'How money comes in. The assumptions panel turns this into numbers.', fields: [['Pricing', '[Price points and plans]'], ['Sales channels', '[Where customers find and buy from you]']] },
      { label: 'Costs & resources', help: 'Fixed costs, people and tools. Link them to your accounts and projects so actual spending is tracked against the plan.', fields: [['Team & hiring', '[Roles needed and when]'], ['Key costs', '[Rent, software, suppliers…]']] },
      { label: 'Milestones', help: 'Dated goals with a budget each. Milestones become projects you can fund from a secondary account.', fields: [['Next 90 days', '[Milestones and owners]'], ['This year', '[Bigger goals]']] }

    const steps = S.map((s, i) => { const on = st.step === i; return { n: i + 1, label: s.label, selected: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#000000' : '#1B1C22', border: on ? '#FFFFFF' : 'rgba(40,50,110,0.18)', numBg: on ? 'linear-gradient(180deg, #4A4E60, #1B1C22)' : 'rgba(40,50,110,0.12)', numFg: on ? '#FFFFFF' : '#1B1C22', pick: () => this.setState({ step: i }) }; });
    const step = { label: S[st.step].label, help: S[st.step].help, fields: S[st.step].fields.map(([label, ph]) => ({ label, ph })) };
    const num = (k) => (e) => { const v = Number(e.target.value); this.setState({ [k]: isNaN(v) ? 0 : v }); };
    const inputs = [
      ['Revenue, month 1', 'start', '€', ''], ['Monthly growth', 'growth', '', '%'], ['Fixed costs / month', 'fixed', '€', ''],
      ['Marketing spend', 'mkt', '', '% rev'], ['Cost of sales', 'cogs', '', '% rev'], ['Starting cash', 'cash', '€', '']
    ].map(([label, k, pre, post]) => ({ label, pre, post, value: st[k], change: num(k) }));

    const names = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
    let cash = st.cash, breakEven = null, totalRev = 0, totalProfit = 0, lowest = cash;
    const m = names.map((label, i) => {
      const rev = st.start * Math.pow(1 + st.growth / 100, i);
      const cost = st.fixed + rev * (st.mkt + st.cogs) / 100;
      const profit = rev - cost;
      cash += profit; totalRev += rev; totalProfit += profit; lowest = Math.min(lowest, cash);
      if (breakEven === null && profit >= 0) breakEven = label;
      return { label, rev, cost, profit, cash };
    });
    const max = Math.max(1, ...m.map(x => Math.max(x.rev, x.cost)));
    const months = m.map(x => ({ label: x.label, revH: Math.round(x.rev / max * 180), costH: Math.round(x.cost / max * 180), revTitle: x.label + ' revenue ' + this.eur(x.rev), costTitle: x.label + ' costs ' + this.eur(x.cost) }));
    const pos = (v) => v >= 0 ? '#3E4257' : '#B4123F';
    const rows = [
      { label: 'Revenue', cells: m.map(x => ({ v: this.short(x.rev), color: '#1B1C22' })) },
      { label: 'Costs', cells: m.map(x => ({ v: this.short(x.cost), color: '#1B1C22' })) },
      { label: 'Profit', cells: m.map(x => ({ v: this.short(x.profit), color: pos(x.profit) })) },
      { label: 'Cash', cells: m.map(x => ({ v: this.short(x.cash), color: pos(x.cash) })) }
    ];
    const summary = [
      { label: '12-month revenue', value: this.eur(totalRev), color: '#1B1C22' },
      { label: '12-month profit', value: this.eur(totalProfit), color: pos(totalProfit) },
      { label: 'Break-even month', value: breakEven || 'Not within 12 months', color: breakEven ? '#B4123F' : '#B4123F' },
      { label: 'Lowest cash point', value: this.eur(lowest), color: pos(lowest) }
    ];
    return { steps, step, inputs, months, rows, summary };
  }
}
