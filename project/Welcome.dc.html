<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alocora Wallet — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C9D2F3}
a{color:#1B1C22}a:hover{color:#000000}
.space{position:relative;isolation:isolate;background-color:#B7C3EE;background-image:radial-gradient(ellipse 150% 55% at -15% 108%,rgba(255,255,255,.9) 0%,rgba(242,244,252,.65) 34%,transparent 62%),radial-gradient(ellipse 75% 42% at 100% 0%,rgba(66,92,222,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0% 28%,rgba(150,124,240,.35),transparent 70%),linear-gradient(165deg,#D6DCF6 0%,#ABBAEE 40%,#90A4E9 62%,#C3CCF2 86%,#EBEDF9 100%)}
.space::after{content:"";position:absolute;z-index:-1;pointer-events:none;left:50%;top:170px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,.25) 45%,transparent 70%);animation:haze 2.4s ease-out both}
.grad{background:linear-gradient(90deg,#3B5BDB 0%,#7C3AED 52%,#C2418C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes haze{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes logoIn{0%{opacity:0;transform:scale(.6);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 20px 50px rgba(52,64,140,.3)}50%{box-shadow:0 0 0 14px rgba(255,255,255,.35),0 24px 60px rgba(52,64,140,.4)}}
@keyframes letterIn{0%{opacity:0;filter:blur(12px);transform:translateY(8px)}60%{opacity:.85;filter:blur(2px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes charIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.tchar{animation:charIn 1.1s cubic-bezier(.25,.6,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.logo-img{animation:logoSoft 2.2s cubic-bezier(.25,.6,.3,1) .3s both;filter:drop-shadow(0 10px 24px rgba(30,60,160,.22))}
@keyframes logoSoft{0%{opacity:0;transform:translateY(14px) scale(.96);filter:blur(14px) drop-shadow(0 10px 24px rgba(30,60,160,0))}60%{opacity:1;filter:blur(1px) drop-shadow(0 10px 24px rgba(30,60,160,.18))}100%{opacity:1;transform:none;filter:blur(0) drop-shadow(0 10px 24px rgba(30,60,160,.22))}}
.wallet-word{animation:fadeUp 1.4s ease-out 1.6s both}
.letter{display:inline-block;animation:letterIn 1.6s cubic-bezier(.25,.6,.3,1) both}
.cursor{animation:blink 1s steps(1) infinite}
.up1{animation:fadeUp 1.1s ease-out both;animation-delay:6.6s}
.up2{animation:fadeUp 1.1s ease-out both;animation-delay:6.95s}
.up3{animation:fadeUp 1.1s ease-out both;animation-delay:7.3s}
.cta:hover{filter:brightness(1.05)}
@media (prefers-reduced-motion: reduce){.logo-img,.wallet-word,.letter,.tchar,.up1,.up2,.up3,.space::after{animation:none}.cursor{animation:none}}
</style>
</helmet>
<div class="space" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 0 24px 40px; font-family: Inter, system-ui, sans-serif; color: #1B1C22; display: flex; flex-direction: column">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding-top: 40px">
    <button type="button" onClick="{{replay}}" aria-label="Replay intro" class="logo-btn" style="border: 0; background: transparent; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <img src="alocora-logo.png" alt="Alocora" class="logo-img" style="display: block; width: 240px; height: auto">
      <span class="wallet-word" style="font-size: 13px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; color: #3E4257; padding-left: 0.42em">Wallet</span>
    </button>
    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">Alocora Wallet</h1>

    <p aria-live="polite" style="margin: 0; min-height: 52px; max-width: 270px; text-align: center; font-size: 15px; line-height: 1.5; color: #2E3244; font-weight: 500"><sc-for list="{{chars}}" as="c" hint-placeholder-count="20"><span class="tchar">{{c}}</span></sc-for><span aria-hidden="true" class="cursor" style="display: inline-block; width: 2px; height: 19px; margin-left: 2px; vertical-align: -3px; background: #7C3AED; opacity: {{cursorOp}}"></span></p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 12px">
    <div class="up1" style="display: flex; justify-content: center; margin-bottom: 10px">
      <div style="display: flex; padding: 4px; gap: 2px; border-radius: 12px; background: rgba(214,220,242,0.6); box-shadow: inset 0 1px 3px rgba(40,50,110,0.18), inset 0 -1px 0 rgba(255,255,255,0.6)">
        <span style="height: 30px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 9px; background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 4px 10px rgba(52,64,140,0.14); font-size: 12px; font-weight: 600; color: #1B1C22">Business</span>
        <span style="height: 30px; display: inline-flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 500; color: #3E4257">Personal</span>
        <span style="height: 30px; display: inline-flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 500; color: #3E4257">Family</span>
      </div>
    </div>
    <a href="MobileLogin.dc.html" class="cta up2" style="height: 48px; border-radius: 15px; background: #1B1C22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px Inter, sans-serif; text-decoration: none; box-shadow: 0 14px 30px rgba(27,28,34,0.3), inset 0 1px 0 rgba(255,255,255,0.15)">Get started<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a href="MobileLogin.dc.html" class="cta up3" style="height: 48px; border-radius: 15px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.95); background: linear-gradient(180deg, #FFFFFF 0%, #F2F4FB 100%); box-shadow: 0 1px 2px rgba(30,40,90,0.14), 0 8px 20px rgba(52,64,140,0.18); color: #1B1C22; display: flex; align-items: center; justify-content: center; font: 600 15px Inter, sans-serif; text-decoration: none">I already have an account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tagline":{"editor":"text","default":"Track spending. Plan projects. Grow together."},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 0, run: 0 };
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearTimeout(this.t0); clearInterval(this.t1); }
  start() {
    clearTimeout(this.t0); clearInterval(this.t1);
    this.setState({ n: 0 });
    this.t0 = setTimeout(() => {
      this.t1 = setInterval(() => {
        const full = this.props.tagline ?? 'Track spending. Plan projects. Grow together.';
        if (this.state.n >= full.length) { clearInterval(this.t1); return; }
        this.setState({ n: this.state.n + 1 });
      }, 85);
    }, 2600);
  }
  renderVals() {
    const full = this.props.tagline ?? 'Track spending. Plan projects. Grow together.';
    const letters = 'Alocora Wallet'.split('').map(c => c === ' ' ? '\u00A0' : c).map((ch, i) => ({ ch, delay: (1.4 + i * 0.22).toFixed(2) + 's' }));
    return {
      letters,
      chars: full.slice(0, this.state.n).split(''),
      cursorOp: this.state.n > 0 ? 1 : 0,
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
